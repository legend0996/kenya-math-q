services:
  - type: web
    name: frontend
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Public URL of the deployed backend — set this in the Render dashboard
      - key: NEXT_PUBLIC_API_URL
        sync: false
    autoDeploy: true
    rootDir: frontend
